# Build cesium-native-python wheels for the CPython that Blender bundles and
# publish them as a GitHub Release asset.  Manual trigger only: the first
# Windows run compiles ~30 vcpkg packages (1–3 h on a hosted runner); later
# runs reuse the cached vcpkg tree (~15 min).
#
# The upstream repo (calebbuffa/cesium-native-python) does not compile on
# MSVC as of 2026-04; third_party/cesium-native-python-windows.patch carries
# the fixes.
name: cesium-native wheel

on:
  workflow_dispatch:
    inputs:
      python:
        description: "CPython version Blender bundles (5.1/5.2 → 3.13)"
        default: "3.13"
      upstream_ref:
        description: "calebbuffa/cesium-native-python ref"
        default: "main"
      release_tag:
        description: "Release tag to attach the wheel to (empty = artifact only)"
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            triplet: x64-windows-static-md
          # - os: ubuntu-22.04      # enable once the Linux link is verified
          # - os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Clone cesium-native-python (+submodules)
        shell: bash
        run: |
          git clone --recurse-submodules --shallow-submodules --depth 1 \
            --branch "${{ inputs.upstream_ref }}" \
            https://github.com/calebbuffa/cesium-native-python.git cnp
          cd cnp && git apply --3way ../third_party/cesium-native-python-windows.patch
          git -C cnp rev-parse HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python }}

      - name: Cache vcpkg (ezvcpkg tree)
        uses: actions/cache@v4
        with:
          path: ~/.ezvcpkg
          key: ezvcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('cnp/extern/cesium-native/vcpkg.json') }}
          restore-keys: ezvcpkg-${{ runner.os }}-${{ matrix.triplet }}-

      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip install -U pip "pybind11<3" scikit-build-core pathspec numpy cmake ninja
          $env:EZVCPKG_BASEDIR = "$HOME/.ezvcpkg"
          $env:VCPKG_MAX_CONCURRENCY = "4"
          $env:CMAKE_BUILD_PARALLEL_LEVEL = "4"
          $p11 = python -c "import pybind11;print(pybind11.get_cmake_dir())"
          $env:CMAKE_ARGS = "-Dpybind11_DIR=$p11"
          python -m pip wheel ./cnp --no-build-isolation --no-deps -w wheels -v

      - uses: actions/upload-artifact@v4
        with:
          name: cesium-python-${{ matrix.os }}-cp${{ inputs.python }}
          path: wheels/*.whl

      - name: Attach to release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.release_tag }}" >/dev/null 2>&1 || \
            gh release create "${{ inputs.release_tag }}" --title "${{ inputs.release_tag }}" --notes "cesium-native-python wheels for Blender"
          gh release upload "${{ inputs.release_tag }}" wheels/*.whl --clobber
