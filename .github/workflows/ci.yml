name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # Pure-Python tests: traversal, coordinates, GLB payload reader. No Blender,
  # no cesium-native (its tests are marked "cesium" and skip when the binding
  # is absent; the wheel comes from the cesium-native-python wheels workflow).
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: python -m pip install --upgrade pip numpy pytest
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests -m "not cesium"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      # errors and undefined names only; style rules are advisory for now
      - run: ruff check --select E9,F src/blender_ogc3dtiles tests scripts
