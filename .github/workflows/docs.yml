# Builds site/ (a standalone Next.js + Fumadocs app: user guide and features in site/content/docs, developer notes
# and screenshots copied from docs/ at build time by site/scripts/sync-content.mjs) and deploys the static export to
# GitHub Pages: https://<owner>.github.io/blender_ogc3dtiles/.
# Run by hand for now. Once Pages is enabled on the repository (Settings > Pages > Source: GitHub Actions), add:
#   push: { branches: [main], paths: ["site/**", "docs/**", ".github/workflows/docs.yml"] }
name: docs site
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.20.0 }        # no package.json at the repository root to infer it from
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm, cache-dependency-path: site/pnpm-lock.yaml }
      - run: pnpm --dir site install --frozen-lockfile
      - run: pnpm --dir site build
      - uses: actions/upload-pages-artifact@v4
        with: { path: site/out }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
